# Multi-task RT-DETRv2-R50 — shared trunk + 5 per-task cls heads.
# ~40 M trunk → ~8 M effective per task (vs dfine-n's 0.8 M).
# bf16 SAFE here (D-FINE-only invariant). Use bf16 for ~2× speed on RTX 50-series.

model:
  arch: rtdetr-r50-multitask
  pretrained: PekingU/rtdetr_v2_r50vd
  input_size: [640, 640]
  num_queries: 300                            # RT-DETRv2 default; D-FINE uses 30
  num_denoising: 0                            # disable CDN initially
  box_noise_scale: 1.0
  label_noise_ratio: 0.5
  eos_coefficient: 0.0001
  focal_loss_alpha: 0.75
  focal_loss_gamma: 2.0
  weight_loss_vfl: 1.0
  matcher_class_cost: 2.0
  share_box_head: true
  share_decoder: true
  task_loss_weights: auto

tensor_prep:
  input_size: [640, 640]
  rescale: true
  normalize: false
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  batch_size: 16                              # R50 is larger; reduce vs dfine-n bs=32
  eval_batch_size: 16
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  sampling_strategy: round_robin_sqrt
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false
  mosaic: false
  mixup: false
  perspective_p: 0.0
  fliplr: 0.5
  flipud: 0.0
  brightness_contrast_p: 0.2
  brightness: 0.1
  contrast: 0.1
  hsv_p: 0.2
  hsv_h: 0.01
  hsv_s: 0.1
  hsv_v: 0.1
  min_bbox_area: 4.0
  scale: [0.9, 1.0]
  degrees: 2.0
  translate: 0.15
  shear: 2.0

training:
  backend: hf_multitask
  epochs: 40
  optimizer: adamw
  lr: 0.00005                                  # 5e-5 — RT-DETRv2 conservative recipe
  weight_decay: 0.0
  warmup_steps: 300                            # RT-DETRv2 canonical (qubvel notebook)
  scheduler: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 0.000001
  max_grad_norm: 0.1
  bf16: true                                   # SAFE for RT-DETRv2 (not for D-FINE)
  amp: false
  gpu_augment: true
  ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 1000
  patience: 20

  val_viz:
    enabled: true
    num_samples: 8
    conf_threshold: 0.05
    grid_cols: 4
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.05
  data_viz:
    enabled: true
    splits: [train, val]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr_multitask

logging:
  report_to: none
  save_dir: ../runs/rtdetr_r50_multitask
  wandb_project: smart-camera
  save_strategy: epoch
  save_total_limit: 5

checkpoint:
  save_best: true
  metric: mean_mAP_50
  mode: max
  save_interval: 1

evaluation:
  score_threshold: 0.015

seed: 42
