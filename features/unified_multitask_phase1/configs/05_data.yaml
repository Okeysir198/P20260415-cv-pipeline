# Multi-task Phase 1 — 5 detection tasks sharing one D-FINE-N backbone.
# Each task has its own classification head; backbone/encoder/decoder/box-head are shared.
# Datasets are NOT merged — each task reads its own training_ready/ tree.

tasks:
  - name: fire_smoke
    dataset_path: ../../../dataset_store/training_ready/fire_detection
    num_classes: 2
    names:
      0: fire
      1: smoke
    # sampling weight: sqrt(N_train); higher = task sampled more often
    weight: auto  # 'auto' = sqrt(train_size); set float to override

  - name: fall
    dataset_path: ../../../dataset_store/training_ready/fall_detection
    num_classes: 2
    names:
      0: person
      1: fallen_person
    weight: auto

  - name: helmet
    dataset_path: ../../../dataset_store/training_ready/helmet_detection
    num_classes: 4
    names:
      0: person
      1: head_with_helmet
      2: head_without_helmet
      3: head_with_nitto_hat
    weight: auto

  - name: shoes
    dataset_path: ../../../dataset_store/training_ready/shoes_detection
    num_classes: 3
    names:
      0: person
      1: foot_with_safety_shoes
      2: foot_without_safety_shoes
    weight: auto

  - name: phone
    dataset_path: ../../../dataset_store/training_ready/safety_poketenashi_phone_usage
    num_classes: 1
    names:
      0: phone_usage
    weight: auto

# Global preprocessing (applied to every task)
input_size: [640, 640]
mean: [0.485, 0.456, 0.406]
std:  [0.229, 0.224, 0.225]
