# Training config — Unified detection (D-FINE-M, HF Trainer backend)
# Phase 1 + Phase 2 partial — 33 IDs reserved, 19 active in R1. ~94k train images.
#
# Bigger backbone justified here vs the 3-class fire_smoke_fall: 5× more data
# AND more diverse classes (faces, hands, full body, small fire). dfine-m is
# the safe pick at bs=16 on 32GB; try dfine-l later if results plateau.

model:
  arch: dfine-m
  pretrained: ustc-community/dfine-medium-obj2coco
  num_classes: 19                  # all IDs reserved; head expansion-ready for Phase 2
  input_size: [640, 640]
  num_queries: 30
  num_denoising: 100
  box_noise_scale: 1.0
  label_noise_ratio: 0.5  # HF default, restored for unified multi-source training
  eos_coefficient: 0.0001
  focal_loss_alpha: 0.9            # hard-example focus on rare positives
  focal_loss_gamma: 3.0            # hard-example focus (down-weights easy preds 10x)
  weight_loss_vfl: 2.0             # cls loss 2x vs bbox/giou
  matcher_class_cost: 4.0          # Hungarian prefers right class

tensor_prep:
  input_size: [640, 640]
  rescale: true
  normalize: false
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  # dfine-m on 33-class unified data; bs=16 fits at 32GB with EMA + 50 queries.
  # Per-source loss masking via features/unified_detection/code/per_source_loss_mask.py
  batch_size: 16
  eval_batch_size: 16
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false
  mosaic: false
  mixup: false

  perspective_p: 0.0
  fliplr: 0.5                     # horizontal flip (safe — fallen detection cares about vertical only)
  flipud: 0.0                     # MANDATORY 0 — vertical flip destroys upright-vs-fallen signal
  brightness_contrast_p: 0.2      # small
  brightness: 0.1                 # small
  contrast: 0.1                   # small
  hsv_p: 0.2                      # small (fire color-defining — keep tight)
  hsv_h: 0.01                     # very tight (fire is color-defining)
  hsv_s: 0.1                      # small
  hsv_v: 0.1                      # small

  min_bbox_area: 4.0

  scale: [0.9, 1.0]               # small zoom-out only (deployment is 640²)
  degrees: 2.0                    # small rotation
  translate: 0.15                 # ±15% — reverted from 0.25 (combined with scale 0.5 was clipping too much)
  shear: 2.0                      # small shear

training:
  backend: hf
  epochs: 60
  optimizer: adamw
  # Bumped 5e-5 → 1e-4 to match D-FINE-N/S (winner LR×bs). Backbone unified with head
  # (no lr_backbone split) — single-LR recipe matched the N/S winning configs.
  lr: 0.0001
  lr_backbone: 0.0001               # explicit: backbone == head LR (no split)
  weight_decay: 0.0
  warmup_steps: 1000              # bumped 300 → 1000 — longer warmup for sharper loss (γ=3.0, α=0.9)
  scheduler: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 0.000001
  max_grad_norm: 0.1
  bf16: false                     # MANDATORY for D-FINE
  amp: false
  gpu_augment: true
  ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 1000
  patience: 20

  val_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.03
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.03
  train_viz:
    enabled: false
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr

logging:
  report_to: none
  save_dir: ../runs/dfine_m
  wandb_project: smart-camera
  save_strategy: epoch
  save_total_limit: 5

checkpoint:
  save_best: true
  metric: eval_map
  mode: max
  save_interval: 1

evaluation:
  score_threshold: 0.015

seed: 42
