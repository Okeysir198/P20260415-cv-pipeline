# Training config — Fire + Smoke + Fallen Person (RT-DETRv2-R50, HF Trainer backend)
# Mirrors safety-fire_detection/configs/06_training_rtdetr_r50.yaml; adapted to 3 classes.

model:
  arch: rtdetr-r50
  pretrained: PekingU/rtdetr_v2_r50vd
  num_classes: 3
  input_size: [640, 640]
  num_queries: 20                 # reduced 30 → 20 (p99=9 GT/image; headroom kept)
  num_denoising: 100
  box_noise_scale: 1.0
  label_noise_ratio: 0.1
  eos_coefficient: 0.0001
  focal_loss_alpha: 0.75
  focal_loss_gamma: 2.0
  # Penalize wrong-class predictions: bump cls loss + matcher class cost.
  weight_loss_vfl: 2.0            # default 1.0 — cls loss 2× vs bbox/giou
  matcher_class_cost: 4.0         # default 2.0 — Hungarian matching prefers right class

tensor_prep:
  input_size: [640, 640]
  rescale: true
  normalize: false
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  batch_size: 16
  eval_batch_size: 16
  num_workers: 4
  prefetch_factor: 2
  pin_memory: false
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false
  mosaic: false
  mixup: false

  perspective_p: 0.0
  fliplr: 0.5
  flipud: 0.0                     # MANDATORY 0 — vertical flip destroys upright-vs-fallen signal
  brightness_contrast_p: 0.5      # bumped 0.3 → 0.5
  brightness: 0.25                # bumped 0.1 → 0.25
  contrast: 0.25                  # bumped 0.1 → 0.25
  hsv_p: 0.2
  hsv_h: 0.01
  hsv_s: 0.2
  hsv_v: 0.2

  min_bbox_area: 4.0

  scale: [0.8, 1.2]
  degrees: 5.0
  translate: 0.15                 # ±15% shift along x/y — stronger position invariance
  shear: 5.0                      # bumped 0.0 → 5.0 (degrees)

training:
  backend: hf
  epochs: 60
  optimizer: adamw
  # Bumped 5e-5 → 1e-4; backbone unified with head (removed the 1:5 split).
  # Prior run undertrained (LR×bs = 4e-4 vs winning N/S 3.2e-3); single-LR matches winners.
  lr: 0.0001
  lr_backbone: 0.0001             # was 1e-5 (1:5 split) — now equal to head
  weight_decay: 0.0001
  warmup_steps: 2000
  scheduler: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 0.000001
  max_grad_norm: 0.1
  bf16: true                      # RT-DETRv2 is bf16-safe
  amp: false                      # fp16 AMP overflows DETR decoder
  gpu_augment: false              # ignored on HF backend
  ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 1000
  patience: 20

  val_viz:
    enabled: true
    num_samples: 40
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.01
  train_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr

logging:
  report_to: none
  save_dir: ../runs/rtdetr_r50
  wandb_project: smart-camera
  save_strategy: epoch
  save_total_limit: 5

checkpoint:
  save_best: true
  metric: eval_map_50
  mode: max
  save_interval: 1

evaluation:
  score_threshold: 0.015

seed: 42
