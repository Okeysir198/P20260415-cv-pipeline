model:
  arch: dfine-n
  pretrained: ustc-community/dfine_n_coco
  num_classes: 3
  input_size:
  - 640
  - 640
  num_queries: 30
  num_denoising: 100
  box_noise_scale: 1.0
  label_noise_ratio: 0.1
  eos_coefficient: 0.0001
  focal_loss_alpha: 0.75
  focal_loss_gamma: 2.0
  weight_loss_vfl: 2.0
  matcher_class_cost: 4.0
tensor_prep:
  input_size:
  - 640
  - 640
  rescale: true
  normalize: false
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  applied_by: hf_processor
data:
  dataset_config: 05_data.yaml
  batch_size: 32
  eval_batch_size: 32
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  subset:
    train: null
    val: null
    test: null
  names:
    0: fire
    1: smoke
    2: fallen_person
augmentation:
  library: torchvision
  normalize: false
  mosaic: false
  mixup: false
  perspective_p: 0.0
  fliplr: 0.5
  flipud: 0.0
  brightness_contrast_p: 0.3
  brightness: 0.1
  contrast: 0.1
  hsv_p: 0.2
  hsv_h: 0.01
  hsv_s: 0.2
  hsv_v: 0.2
  min_bbox_area: 4.0
  scale:
  - 0.9
  - 1.1
  degrees: 5.0
  translate: 0.15
  shear: 0.0
training:
  backend: hf
  epochs: 60
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.0
  warmup_steps: 300
  scheduler: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 1.0e-05
  max_grad_norm: 0.1
  bf16: false
  amp: false
  gpu_augment: true
  ema: false
  patience: 20
  val_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.03
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.03
  train_viz:
    enabled: false
  data_viz:
    enabled: true
    splits:
    - train
    - val
    - test
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits:
    - train
    num_samples: 16
    grid_cols: 4
loss:
  type: detr
logging:
  report_to: none
  save_dir: ../runs/dfine_n
  wandb_project: smart-camera
  save_strategy: epoch
  save_total_limit: 5
checkpoint:
  save_best: true
  metric: eval_map_50
  mode: max
  save_interval: 1
evaluation:
  score_threshold: 0.015
seed: 42
_config_path: features/safety-fire_smoke_fall/configs/06_training_dfine_n.yaml
