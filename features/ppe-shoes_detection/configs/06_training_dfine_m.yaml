# Training config — Shoes Detection (D-FINE-M, HF Trainer backend)
# License: Apache 2.0 (USTC / DEIM)
#
# Recipe: official Peterande/D-FINE per-arch dfine_hgnetv2_m_coco.yml — layered
# AdamW with 1:2 LR ratio, constant_with_warmup, clip 0.1, EMA 0.9999. obj2coco pretrain.
#
# Shoes notes:
# - 3 classes (person 2.4%, foot_with_safety_shoes 68%, foot_without_safety_shoes 29%).
# - Foot bboxes skew small; 960x960 stride-8 features give 120x120 cells.
# - 37k imgs — largest Phase-B dataset.
#
# Run:
#   CUDA_VISIBLE_DEVICES=0 uv run core/p06_training/train.py \
#     --config features/ppe-shoes_detection/configs/06_training_dfine_m.yaml

model:
  arch: dfine-m
  pretrained: ustc-community/dfine-medium-obj2coco  # canonical hyphenated
  num_classes: 3
  input_size: [960, 960]
  num_queries: 20                # 300 -> 20 — fewer query slots reduces background-FP flooding
  num_denoising: 100             # HF default
  box_noise_scale: 1.0
  label_noise_ratio: 0.5
  eos_coefficient: 0.0001        # paper default (D-FINE DFL head)
  focal_loss_alpha: 0.75         # paper default
  focal_loss_gamma: 2.0          # paper default

tensor_prep:
  input_size: [960, 960]
  rescale: true
  normalize: false
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  # bs 4 — D-FINE-M at 960^2 fp32 estimate ~28 GB.
  batch_size: 4
  eval_batch_size: 2
  num_workers: 4
  prefetch_factor: 2
  pin_memory: false
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false
  mosaic: false
  mixup: false

  perspective_p: 0.1
  fliplr: 0.5
  flipud: 0.0
  brightness_contrast_p: 0.5
  brightness: 0.2
  contrast: 0.2
  hsv_p: 0.3
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.4
  min_bbox_area: 4.0

  scale: [0.7, 1.3]              # wider jitter — helps small-object recall
  degrees: 15.0
  translate: 0.15
  shear: 2.0

training:
  backend: hf
  epochs: 60                     # mirrors fire D-FINE-M
  optimizer: adamw
  # Per-arch dfine_hgnetv2_m_coco.yml: 1:2 LR ratio, paper bs=128.
  # Linear-scaled to bs=4: 2e-4 head, 1e-4 backbone.
  lr: 0.0002
  lr_backbone: 0.0001
  weight_decay: 0.0001
  warmup_steps: 500
  scheduler: constant_with_warmup
  max_grad_norm: 0.1
  bf16: false                    # MANDATORY for D-FINE
  amp: false
  gpu_augment: false
  ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 1000
  patience: 20                   # mirrors fire D-FINE-M

  val_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.01
  train_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr

logging:
  report_to: none
  save_dir: ../runs/dfine_m
  wandb_project: smart-camera

checkpoint:
  save_best: true
  metric: eval_map_50
  mode: max
  save_interval: 1

evaluation:
  score_threshold: 0.0

seed: 42
