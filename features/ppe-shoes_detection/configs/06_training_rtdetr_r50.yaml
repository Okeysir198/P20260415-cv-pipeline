# Training config — Shoes Detection (RT-DETRv2-R50, HF Trainer backend)
#
# Recipe: paper-aligned (RT-DETRv2 arXiv 2407.17140) + v3 loss overhaul lifted
# from fire_detection R50 v3 (eos=0.1, focal_alpha=0.5, focal_gamma=1.5; lr=5e-5;
# EMA on with decay=0.999 + 500-step warmup so it engages early).
#
# Shoes notes:
# - 3 classes (person 2.4%, foot_with_safety_shoes 68%, foot_without_safety_shoes 29%).
# - Foot bboxes skew small — 1024 stride-8 cells go to 128x128.
# - 37k imgs — largest Phase-B dataset.
#
# Run:
#   CUDA_VISIBLE_DEVICES=0 uv run core/p06_training/train.py \
#     --config features/ppe-shoes_detection/configs/06_training_rtdetr_r50.yaml

model:
  arch: rtdetr-r50
  pretrained: PekingU/rtdetr_v2_r50vd
  num_classes: 3
  input_size: [1024, 1024]
  # 50 queries — shoes scenes have ~2-3 GTs/image (p99 < 10). 50 = ~5x p99
  # headroom while keeping background-FP risk in check.
  num_queries: 50
  num_denoising: 100
  # Loss-recipe overhaul (mirrors fire R50 v3):
  box_noise_scale: 1.0
  label_noise_ratio: 0.3
  eos_coefficient: 0.1
  focal_loss_alpha: 0.5
  focal_loss_gamma: 1.5

tensor_prep:
  input_size: [1024, 1024]
  rescale: true
  normalize: false               # A/B with normalize=true; shoes data is general
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  batch_size: 4
  eval_batch_size: 2
  num_workers: 4
  prefetch_factor: 2
  pin_memory: false
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false
  mosaic: false
  mixup: false

  perspective_p: 0.1
  fliplr: 0.5
  flipud: 0.0
  brightness_contrast_p: 0.5
  brightness: 0.2
  contrast: 0.2
  hsv_p: 0.3
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.4
  min_bbox_area: 4.0

  scale: [0.9, 1.1]
  degrees: 10.0
  translate: 0.1
  shear: 2.0

training:
  backend: hf
  epochs: 30
  optimizer: adamw
  # Layered AdamW per RT-DETRv2 R50 paper: head 1e-4, backbone 1e-5 -> halved
  # to 5e-5 / 1e-5 to match fire R50 v3's stable recipe.
  lr: 0.00005
  lr_backbone: 0.00001
  weight_decay: 0.0001
  warmup_steps: 2000
  scheduler: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 0.000005
  max_grad_norm: 0.5
  bf16: true
  amp: false
  gpu_augment: false
  ema: true                      # R50 needs it for late-epoch smoothing
  ema_decay: 0.999
  ema_warmup_steps: 500
  patience: 15

  val_viz:
    enabled: true
    num_samples: 40
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.01
  train_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr

logging:
  report_to: none
  save_dir: ../runs/rtdetr_r50
  wandb_project: smart-camera

checkpoint:
  save_best: true
  metric: eval_map_50
  mode: max
  save_interval: 1

evaluation:
  score_threshold: 0.0

seed: 42
