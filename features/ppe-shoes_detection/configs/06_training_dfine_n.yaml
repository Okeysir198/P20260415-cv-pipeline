# Training config — Shoes Detection (D-FINE-N, HF Trainer backend)
# License: Apache 2.0 (USTC / DEIM)
#
# Recipe: official Peterande/D-FINE per-arch dfine_hgnetv2_n_coco.yml — layered
# AdamW with 1:2 LR ratio, constant_with_warmup, clip 0.1, EMA 0.9999.
# This is the smallest D-FINE variant (~3.8 M params). Smoke-config for the
# 37k-image shoes dataset; dfine_s/m are the production candidates.
#
# Shoes notes:
# - 3 classes (person 2.4%, foot_with_safety_shoes 68%, foot_without_safety_shoes 29%).
# - Foot bboxes skew small — D-FINE-N outputs stride-16/32 only (NOT stride-8).
# - 37k imgs — largest Phase-B dataset.
#
# Run:
#   CUDA_VISIBLE_DEVICES=0 uv run core/p06_training/train.py \
#     --config features/ppe-shoes_detection/configs/06_training_dfine_n.yaml

model:
  arch: dfine-n
  # NOTE: D-FINE nano has only COCO pretrain on HF — no obj2coco variant exists for nano
  pretrained: ustc-community/dfine_n_coco
  num_classes: 3
  input_size: [640, 640]
  num_queries: 300               # paper exact (custom-fine-tune yml)
  num_denoising: 100             # HF default
  box_noise_scale: 1.0           # paper default
  label_noise_ratio: 0.5         # paper default
  eos_coefficient: 0.0001        # paper default
  focal_loss_alpha: 0.75         # paper default
  focal_loss_gamma: 2.0          # paper default

tensor_prep:
  input_size: [640, 640]
  rescale: true
  normalize: false
  mean: [0.485, 0.456, 0.406]    # ignored when normalize=false
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  batch_size: 4
  eval_batch_size: 2
  num_workers: 4
  prefetch_factor: 2
  pin_memory: false
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false
  mosaic: false                  # DETR-family bad with mosaic
  mixup: false

  perspective_p: 0.1
  fliplr: 0.5
  flipud: 0.0
  brightness_contrast_p: 0.5
  brightness: 0.2
  contrast: 0.2
  hsv_p: 0.3
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.4
  min_bbox_area: 4.0

  # Tight scale — foot bbox is already small.
  scale: [0.9, 1.1]
  degrees: 5.0
  translate: 0.1
  shear: 2.0

training:
  backend: hf
  epochs: 120                    # paper-fine-tune-N is 220 ep * bs=128. Linear-scale to bs=4 -> ~120 ep
  optimizer: adamw
  # D-FINE-N specifically uses 1:2 LR ratio (NOT 1:20 like S/M/L/X).
  # Paper bs=128 -> lr=8e-4 head, 4e-4 backbone. Linear-scaled to our bs=4:
  # 8e-4 * 4/128 = 2.5e-5 -> 2e-4 head, 1e-4 backbone.
  lr: 0.0002
  lr_backbone: 0.0001
  weight_decay: 0.000125
  warmup_steps: 500
  scheduler: constant_with_warmup
  max_grad_norm: 0.1
  bf16: false                    # MANDATORY for D-FINE
  amp: false
  gpu_augment: false             # HF Trainer uses its own DataLoader
  ema: true                      # paper default
  ema_decay: 0.9999
  ema_warmup_steps: 1000
  patience: 30                   # D-FINE-N DFL breakthrough may be late + sudden

  val_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01         # DETR sigmoid scores cap ~0.2
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.01
  train_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr

logging:
  report_to: none
  save_dir: ../runs/dfine_n
  wandb_project: smart-camera

checkpoint:
  save_best: true
  metric: eval_map_50
  mode: max
  save_interval: 1               # mandatory for D-FINE

evaluation:
  score_threshold: 0.0

seed: 42
