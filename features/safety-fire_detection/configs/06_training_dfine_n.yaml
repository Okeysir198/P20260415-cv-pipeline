# Training config — Fire Detection (D-FINE-N, HF Trainer backend)
# Based on reference baseline from notebooks/detr_finetune_reference/our_dfine_torchvision/
# Reference best on CPPE-5: dfine-n norm=false ema=true → test mAP50=0.710
# Adapted for fire: 2 classes, obj2coco pretrained, 640 input

model:
  arch: dfine-n
  pretrained: ustc-community/dfine_n_coco
  num_classes: 2
  input_size: [640, 640]
  num_queries: 30                # HF default: 300
  num_denoising: 100             # HF default: 100
  box_noise_scale: 1.0           # HF default: 1.0 (no change)
  label_noise_ratio: 0.1         # HF default: 0.5 → reduced over-regularization
  eos_coefficient: 0.1           # HF default: 0.0001 → penalize orphan-query background FPs
  focal_loss_alpha: 0.5          # HF default: 0.75 → balanced, remove positive-class bias
  focal_loss_gamma: 1.5          # HF default: 2.0 → smoother gradients

tensor_prep:
  input_size: [640, 640]
  rescale: true
  normalize: false
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  batch_size: 8
  eval_batch_size: 8
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false                # HF processor handles normalization
  # Standardized augmentation across all model types (RT-DETR + D-FINE)
  # R18 v2 + R50 v2 showed overfitting with weak aug; stronger aug extends stability.
  # Color stays tight (fire color is class-defining); scale, position, brightness loosen up.
  mosaic: true                    # Single biggest aug lever for small datasets
  mixup: false                    # Bipartite matching + mixup is fragile

  perspective_p: 0.1
  fliplr: 0.5
  flipud: 0.0
  brightness_contrast_p: 0.5
  brightness: 0.2                 # Fire/smoke happen across lighting conditions
  contrast: 0.2
  hsv_p: 0.3
  hsv_h: 0.015                    # KEEP TIGHT — fire color is class-defining
  hsv_s: 0.3                      # KEEP TIGHT — same reason
  hsv_v: 0.4                      # Value is safe (doesn't change color identity)

  min_bbox_area: 4.0              # Keep small fire/smoke (2×2 px minimum)

  scale: [0.7, 1.3]               # ±30% jitter, helps small-recall
  degrees: 15.0
  translate: 0.15
  shear: 2.0

training:
  backend: hf
  epochs: 60                      # Extended from 30 for full convergence
  optimizer: adamw
  lr: 0.00005                     # Reference baseline: 5e-5 (flat LR, no backbone split)
  weight_decay: 0.0               # Reference baseline: 0 (D-FINE uses wd=0)
  warmup_steps: 300               # Reference baseline: 300
  scheduler: linear               # Reference baseline: linear
  max_grad_norm: 0.1              # HF default: 0.1 (no change)
  bf16: false                     # MANDATORY for D-FINE (DFL stalls under bf16)
  amp: false
  gpu_augment: false
  ema: true                       # Reference baseline: true for dfine-n
  ema_decay: 0.9999               # Reference baseline: 0.9999
  ema_warmup_steps: 1000          # Reference baseline: 1000
  patience: 20

  val_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.01
  train_viz:
    enabled: false
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr

logging:
  report_to: none
  save_dir: ../runs/dfine_n
  wandb_project: smart-camera

checkpoint:
  save_best: true
  metric: eval_map
  mode: max
  save_interval: 1

evaluation:
  score_threshold: 0.015          # Near-canonical mAP (filters noise). Inference uses 0.075 per-class (see 10_inference.yaml — validate via threshold_sweep.py across full range)

seed: 42
