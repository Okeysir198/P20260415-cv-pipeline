# Training config — Fire Detection (D-FINE-N, HF Trainer backend)
# License: Apache 2.0 (USTC / DEIM)
#
# Recipe: official Peterande/D-FINE optimizer.yml — layered AdamW (head 2.5e-4,
# backbone 1.25e-5 = 1:20), constant_with_warmup, clip 0.1, EMA 0.9999.

model:
  arch: dfine-n
  pretrained: ustc-community/dfine_n_coco
  num_classes: 2
  # 960×960 — small recall lever, mirrors RT-DETR R18/R50 v2 recipe.
  # Fire data: 15.4% boxes <32² px; stride-8 cells go 80²→120².
  input_size: [960, 960]
  # Loss recipe REVERTED to HF defaults (2026-05-05) — the v2 RT-DETR overhaul
  # (eos=0.1, focal_α=0.5, focal_γ=1.5) destabilized D-FINE-S (val mAP collapsed
  # from 0.16 ep1 to 0.06 by ep10). D-FINE's distribution-focal-loss head
  # interacts differently with these knobs than RT-DETR's vanilla regression
  # head. Reverting to paper-aligned defaults — these were specifically
  # validated for D-FINE in Peterande/D-FINE/configs/dfine/include/optimizer.yml.
  num_queries: 30                # 3.3× p99 headroom; safe small-data deviation
  num_denoising: 100             # HF default
  box_noise_scale: 1.0           # paper default
  label_noise_ratio: 0.5         # paper default (was 0.3 v2)
  eos_coefficient: 0.0001        # paper default (was 0.1 v2)
  focal_loss_alpha: 0.75         # paper default (was 0.5 v2)
  focal_loss_gamma: 2.0          # paper default (was 1.5 v2)

# DFineImageProcessor rescales /255 (rescale=true) but does NOT apply ImageNet
# mean/std — fire dataset stats are off-distribution from ImageNet.
tensor_prep:
  input_size: [960, 960]
  rescale: true
  normalize: false
  mean: [0.485, 0.456, 0.406]  # ignored when normalize=false
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  # bs 8 → 4 — D-FINE-S runs fp32 (no bf16); 960² + bs=8 fp32 estimate ~28 GB
  # which is too tight on 32 GB GPU. Override to 8 if GPU has >25 GB free.
  batch_size: 4
  eval_batch_size: 2
  num_workers: 4
  prefetch_factor: 2             # 4 → 2 — bound RAM pressure (lessons from RT-DETR runs)
  pin_memory: false              # was true — pinned memory adds RAM pressure
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false              # HF processor handles it; feed [0,1]
  # Mosaic STAYS OFF — empirically confirmed bad on DETR-family in R18 v3 run
  # (2026-05-05): mosaic ran for 27+ epochs and consistently scored 0.04-0.06
  # mAP below v2 (no mosaic). Bipartite matching disturbed by 4× box density.
  mosaic: false
  mixup: false

  perspective_p: 0.1
  fliplr: 0.5
  flipud: 0.0
  brightness_contrast_p: 0.5    # 0.3 → 0.5 — apply more often
  brightness: 0.2               # 0.1 → 0.2 — fire/smoke happen across lighting conditions
  contrast: 0.2                 # 0.1 → 0.2
  hsv_p: 0.3                    # 0.1 → 0.3 — apply more often
  hsv_h: 0.015                  # KEEP TIGHT — fire color is class-defining
  hsv_s: 0.3                    # KEEP TIGHT — same reason
  hsv_v: 0.4                    # 0.3 → 0.4 — value is safe (doesn't change color identity)
  min_bbox_area: 4.0

  scale: [0.7, 1.3]             # was [0.9, 1.1] — ±30% jitter, also helps small-recall
  degrees: 15.0                 # 10 → 15
  translate: 0.15               # 0.1 → 0.15
  shear: 2.0

training:
  backend: hf
  epochs: 60                     # 40 → 60 (2026-05-05) — paper does 132 ep; 60 covers DFL breakthrough zone + margin without wasting GPU
  optimizer: adamw
  # Layered AdamW per official D-FINE optimizer.yml. _DetectionTrainer.
  # create_optimizer reads lr_backbone and splits params by "backbone" name.
  lr: 0.00025
  lr_backbone: 0.0000125         # 1:20 split (paper)
  weight_decay: 0.000125
  warmup_steps: 500
  scheduler: constant_with_warmup
  max_grad_norm: 0.1
  bf16: false                    # MANDATORY for D-FINE — DFL stalls under bf16
  amp: false                     # fp16 AMP overflows DETR decoder
  gpu_augment: false             # HF Trainer uses its own DataLoader
  ema: true                      # paper default
  ema_decay: 0.9999
  ema_warmup_steps: 1000
  patience: 20                   # 15 → 20 (2026-05-05) — D-FINE breakthrough is sudden; needs more headroom than RT-DETR

  val_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01         # DETR sigmoid scores cap ~0.2
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.01
  train_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr

logging:
  report_to: none                # avoid wandb/tensorboard hard-fails on missing creds
  save_dir: ../runs/dfine_n
  wandb_project: smart-camera

checkpoint:
  save_best: true
  metric: eval_map_50
  mode: max
  save_interval: 1               # mandatory for D-FINE — DFL best ckpt arrives suddenly

evaluation:
  score_threshold: 0.0           # canonical mAP

seed: 42
