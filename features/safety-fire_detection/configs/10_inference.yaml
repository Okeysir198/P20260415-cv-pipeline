# Inference + alert config for the fire feature.
# Loaded by core.p10_inference.video_inference.load_alert_config.

model:
  weights: ../runs/best.pt        # relative to this file
  # DETR sigmoid scores cap ~0.2; default 0.05 floods FPs. Re-sweep this value
  # via scripts/threshold_sweep.py after each retrain. Do not raise above 0.10
  # or recall collapses.
  conf: 0.075
  iou: 0.45

alerts:
  # Alert-time thresholds applied after detection. Tighter than model.conf to
  # reduce false alarms downstream.
  confidence_thresholds: {fire: 0.10, smoke: 0.10}
  frame_windows: {}
  window_ratio: 0.8
  cooldown_frames: 90

tracker:
  type: bytetrack
  track_activation_threshold: 0.10  # match detector operating point
  lost_track_buffer: 30
  minimum_iou_threshold: 0.1
  frame_rate: 30

samples:
  images: []   # fill with paths under ../samples/
  videos: []
