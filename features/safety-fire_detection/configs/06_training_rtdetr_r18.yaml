# Training config — Fire Detection (RT-DETRv2-R18, HF Trainer backend)
#
# Recipe: paper-aligned (RT-DETRv2 arXiv 2407.17140 Table 1 + official
# optimizer.yml). AdamW (single LR 1e-4 — R18 has no backbone split per paper),
# constant_with_warmup, EMA 0.9999 with 2000-step warmup.

model:
  arch: rtdetr-r18
  pretrained: PekingU/rtdetr_v2_r18vd
  num_classes: 2
  input_size: [640, 640]
  num_queries: 30                 # fire p99=9 boxes/img → 300 wastes capacity (only deviation from HF default)
  num_denoising: 100              # HF default
  box_noise_scale: 1.5            # 1.0 → 1.5 — bbox geometry is noisy (smoke boundaries vary; fire boxes split vs merge inconsistently)
  label_noise_ratio: 0.5          # HF default — boundary ambiguity (smoke boxes sometimes include fire pixels) makes cls regularization useful
  eos_coefficient: 0.0001         # HF default for RT-DETRv2 (focal-loss world; 0.1 is vanilla DETR)
  focal_loss_alpha: 0.75          # HF default
  focal_loss_gamma: 2.0           # HF default

# normalize: false — fire dataset stats (mean ~0.39, std ~0.28) diverge from
# ImageNet (mean ~0.45, std ~0.23). Skipping normalize lets BatchNorm recenter
# per-batch and yields better convergence on this distribution.
tensor_prep:
  input_size: [640, 640]
  rescale: true
  normalize: false
  mean: [0.485, 0.456, 0.406]    # ignored when normalize=false
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  batch_size: 16
  eval_batch_size: 4              # OOM safety for RT-DETR eval
  num_workers: 8                  # HF backend is CPU-aug bound
  prefetch_factor: 6
  pin_memory: true
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false                # HF processor handles normalization
  mosaic: false                   # DETR-family doesn't use it
  mixup: false

  perspective_p: 0.1
  fliplr: 0.5
  flipud: 0.0
  brightness_contrast_p: 0.3      # light only — fire color is class-defining
  brightness: 0.1
  contrast: 0.1
  hsv_p: 0.1
  hsv_h: 0.015                    # tight HSV — color is class-defining for fire/smoke
  hsv_s: 0.3
  hsv_v: 0.3

  min_bbox_area: 4.0              # keep small fire/smoke (2×2 px minimum)

  scale: [0.9, 1.1]
  degrees: 10.0
  translate: 0.1
  shear: 2.0

training:
  backend: hf
  epochs: 30                      # R18/R50 peak before ep15 on this dataset
  optimizer: adamw
  lr: 0.0001                      # paper Table 1, R18 row — single LR (no backbone split)
  weight_decay: 0.0001
  warmup_steps: 2000              # paper LinearWarmup
  # Cosine decay 1e-4 → 1e-5 over the run. Paper uses MultiStepLR with milestone
  # past run end (effectively flat); for our 30-epoch fine-tune a cooldown phase
  # helps the model settle near the end instead of overshooting (early peak then
  # noisy plateau observed at flat LR).
  scheduler: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 0.00001               # absolute floor (1e-5 = 10% of initial 1e-4)
  max_grad_norm: 0.1
  bf16: true
  amp: false                      # fp16 AMP overflows DETR decoder
  gpu_augment: false              # ignored on HF backend
  ema: true                       # paper default
  ema_decay: 0.9999
  ema_warmup_steps: 2000
  patience: 15

  val_viz:
    enabled: true
    num_samples: 40
    conf_threshold: 0.01          # DETR sigmoid scores cap ~0.2
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.01
  train_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr

logging:
  report_to: none
  save_dir: ../runs/rtdetr_r18
  wandb_project: smart-camera

checkpoint:
  save_best: true
  metric: eval_map_50
  mode: max
  save_interval: 1

evaluation:
  score_threshold: 0.0            # canonical mAP

seed: 42
