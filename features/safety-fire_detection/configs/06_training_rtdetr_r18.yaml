# Training config — Fire Detection (RT-DETRv2-R18, HF Trainer backend)
#
# Recipe: paper-aligned (RT-DETRv2 arXiv 2407.17140 Table 1 + official
# optimizer.yml). AdamW (single LR 1e-4 — R18 has no backbone split per paper),
# constant_with_warmup, EMA 0.9999 with 2000-step warmup.

model:
  arch: rtdetr-r18
  pretrained: PekingU/rtdetr_v2_r18vd
  num_classes: 2
  # 960×960 (was 640) — strongest single lever for small-object recall.
  # Train data: 15.4% of boxes are <32² px (small tier); recall on small was
  # 0.30 at 640. Stride-8 feature map: 80×80 → 120×120, so a 32-px box now
  # spans ~6 cells (was ~4) — comfortably above the 2-cell detection floor.
  # Capped at 960 because ~half of source images are native 640×640
  # (some 416×416), so upscaling beyond this just interpolates fake detail.
  input_size: [640, 640]
  # 100 → 30 (reverted, 2026-05-05) — observed background-FP flooding at 100.
  # Fire data has ~2 GTs / image (p99=9), so 100 queries left ~98 orphan
  # queries with no real object to assign to. Under focal_loss_alpha=0.75
  # (positive-favoring), orphans get pulled toward firing on weak background
  # signals → val PNGs showed dense low-confidence FPs across non-fire areas.
  # 30 = 3.3× p99 headroom, enough for crowded smoke-fire scenes without
  # surplus. Also reduces VRAM/RAM accumulation per eval batch.
  num_queries: 30                  # HF default: 300
  num_denoising: 100              # HF default: 100
  # Loss-recipe overhaul (2026-05-05) — first run with HF defaults peaked at
  # ep3 (mAP=0.445) then collapsed to 0.19 by ep14 with heavy background FPs
  # AND many FNs simultaneously (calibration squash). Switching to the
  # "less aggressive" recipe below: penalize orphan-query background FPs,
  # remove positive-class bias, smooth gradients on hard examples, reduce
  # denoising-noise injection. Departing from HF defaults intentionally
  # based on observed behavior, not docs.
  box_noise_scale: 1.0            # HF default: 1.0 (no change)
  label_noise_ratio: 0.1          # HF default: 0.5 → reduced over-regularization
  eos_coefficient: 0.0001         # HF default
  focal_loss_alpha: 0.75          # HF default
  focal_loss_gamma: 2.0           # HF default

# normalize: false — fire dataset stats (mean ~0.39, std ~0.28) diverge from
# ImageNet (mean ~0.45, std ~0.23). Skipping normalize lets BatchNorm recenter
# per-batch and yields better convergence on this distribution.
tensor_prep:
  input_size: [640, 640]
  rescale: true
  normalize: false
  mean: [0.485, 0.456, 0.406]    # ignored when normalize=false
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  # 16 → 4 to fit 960×960 in 24 GB. Self-attention over stride-8 tokens is
  # O(N²) where N=14400 at 960 vs 6400 at 640 — 5× more attention cost per
  # image, so memory grows worse than linearly with input_size. (HF backend
  # does not currently wire `gradient_accumulation_steps` through
  # `_config_to_training_args`, so effective batch is the per-device batch.)
  batch_size: 8
  eval_batch_size: 2              # 4 → 2 — same OOM-safety logic, scaled for 960
  num_workers: 4                  # HF backend is CPU-aug bound
  prefetch_factor: 2
  pin_memory: true
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false                # HF processor handles normalization
  # Aug overhaul (2026-05-05 v3) — R18 v2 + R50 v2/v3 all peaked at ep3 then
  # overfit with weak aug. Strengthening aug to extend the "fresh data"
  # runway. Color stays tight (fire color is class-defining); scale, position,
  # brightness loosen up. Mosaic re-enabled — prior CLAUDE.md warning was from
  # the unstable v0 loss recipe; v2 recipe (eos=0.1, focal_α=0.5) should
  # tolerate it. Re-test on R18 first; if stable, propagate to R50.
  mosaic: false                   # disabled — destabilizes bipartite matching + costly CPU disk I/O on subset runs
  mixup: false                    # leaving off; bipartite matching + mixup is fragile

  # Light aug recipe (reduced from v3 aggressive)
  perspective_p: 0.0              # off — fire/smoke do not have rigid structure that benefits
  fliplr: 0.5
  flipud: 0.0
  brightness_contrast_p: 0.3
  brightness: 0.1
  contrast: 0.1
  hsv_p: 0.2
  hsv_h: 0.01                     # tight — fire color is class-defining
  hsv_s: 0.2
  hsv_v: 0.2

  min_bbox_area: 4.0              # keep small fire/smoke (2×2 px minimum)

  scale: [0.9, 1.1]               # ±10% jitter
  degrees: 5.0
  translate: 0.05
  shear: 0.0

training:
  backend: hf
  epochs: 60                      # Extended from 30 for full convergence
  optimizer: adamw
  # 1e-4 → 5e-5 (2026-05-05) — first run with 1e-4 peaked at ep3 (mAP=0.445)
  # then collapsed to 0.19 by ep13 (classic DETR overfit + miscalibration
  # documented in feature CLAUDE.md). 5e-5 halves the gradient magnitude so
  # the model settles instead of bouncing past the optimum.
  lr: 0.0001                      # HF default 1e-4 (paper Table 1 R18 row)
  weight_decay: 0.0001            # HF default: 1e-4 (no change)
  warmup_steps: 2000              # HF default: varies → paper LinearWarmup
  # Cosine decay 1e-4 → 1e-5 over the run. Paper uses MultiStepLR with milestone
  # past run end (effectively flat); for our 30-epoch fine-tune a cooldown phase
  # helps the model settle near the end instead of overshooting (early peak then
  # noisy plateau observed at flat LR).
  scheduler: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 0.00001               # absolute floor (1e-5 = 10% of initial 1e-4)
  max_grad_norm: 0.1
  bf16: true
  amp: false                      # fp16 AMP overflows DETR decoder
  gpu_augment: false              # ignored on HF backend
  ema: false                       # paper default
  ema_decay: 0.9999
  ema_warmup_steps: 2000
  patience: 20

  val_viz:
    enabled: true
    num_samples: 40
    conf_threshold: 0.01          # DETR sigmoid scores cap ~0.2
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.01
  train_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr

logging:
  report_to: none
  save_dir: ../runs/rtdetr_r18
  wandb_project: smart-camera

checkpoint:
  save_best: true
  metric: eval_map_50
  mode: max
  save_interval: 1

evaluation:
  score_threshold: 0.015          # Near-canonical mAP (filters noise). Inference uses 0.075 per-class (see 10_inference.yaml — validate via threshold_sweep.py across full range)

seed: 42
