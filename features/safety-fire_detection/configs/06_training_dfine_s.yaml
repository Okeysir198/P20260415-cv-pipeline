# Training config — Fire Detection (D-FINE-S, HF Trainer backend)
# License: Apache 2.0 (USTC / DEIM)
#
# Recipe: official Peterande/D-FINE optimizer.yml — layered AdamW (head 2.5e-4,
# backbone 1.25e-5 = 1:20), constant_with_warmup, clip 0.1, EMA 0.9999.

model:
  arch: dfine-s
  pretrained: ustc-community/dfine_s_coco
  num_classes: 2
  input_size: [640, 640]      # fire/smoke are predominantly tiny (<1% of image)

# DFineImageProcessor rescales /255 (rescale=true) but does NOT apply ImageNet
# mean/std — fire dataset stats are off-distribution from ImageNet.
tensor_prep:
  input_size: [640, 640]
  rescale: true
  normalize: false
  mean: [0.485, 0.456, 0.406]  # ignored when normalize=false
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  batch_size: 8
  eval_batch_size: 4
  num_workers: 4
  prefetch_factor: 4
  pin_memory: true
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false              # HF processor handles it; feed [0,1]
  mosaic: false                 # DETR-family doesn't use it
  mixup: false

  perspective_p: 0.1
  fliplr: 0.5
  flipud: 0.0
  brightness_contrast_p: 0.3
  brightness: 0.1
  contrast: 0.1
  hsv_p: 0.1
  hsv_h: 0.015
  hsv_s: 0.3
  hsv_v: 0.3
  min_bbox_area: 4.0

  scale: [0.9, 1.1]
  degrees: 10.0
  translate: 0.1
  shear: 2.0

training:
  backend: hf
  epochs: 80
  optimizer: adamw
  # Layered AdamW per official D-FINE optimizer.yml. _DetectionTrainer.
  # create_optimizer reads lr_backbone and splits params by "backbone" name.
  lr: 0.00025
  lr_backbone: 0.0000125         # 1:20 split (paper)
  weight_decay: 0.000125
  warmup_steps: 500
  scheduler: constant_with_warmup
  max_grad_norm: 0.1
  bf16: false                    # MANDATORY for D-FINE — DFL stalls under bf16
  amp: false                     # fp16 AMP overflows DETR decoder
  gpu_augment: false             # HF Trainer uses its own DataLoader
  ema: true                      # paper default
  ema_decay: 0.9999
  ema_warmup_steps: 1000
  patience: 100                  # DFL breakthrough often at ep25-30; mAP@50 selector is noisy

  val_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01         # DETR sigmoid scores cap ~0.2
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.01
  train_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr

logging:
  report_to: none                # avoid wandb/tensorboard hard-fails on missing creds
  save_dir: ../runs/dfine_s
  wandb_project: smart-camera

checkpoint:
  save_best: true
  metric: eval_map_50
  mode: max
  save_interval: 1               # mandatory for D-FINE — DFL best ckpt arrives suddenly

evaluation:
  score_threshold: 0.0           # canonical mAP

seed: 42
