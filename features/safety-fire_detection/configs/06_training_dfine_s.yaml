# Training config — Fire Detection (D-FINE-S, HF Trainer backend)
# Based on reference baseline from notebooks/detr_finetune_reference/our_dfine_torchvision/
# Reference best on CPPE-5: dfine-s norm=false ema=false → test mAP50=0.603
# Adapted for fire: 2 classes, obj2coco pretrained, 640 input

model:
  arch: dfine-s
  pretrained: ustc-community/dfine-small-obj2coco
  num_classes: 2
  input_size: [640, 640]
  num_queries: 30
  num_denoising: 100
  box_noise_scale: 1.0
  label_noise_ratio: 0.3
  eos_coefficient: 0.1
  focal_loss_alpha: 0.5
  focal_loss_gamma: 1.5

tensor_prep:
  input_size: [640, 640]
  rescale: true
  normalize: false
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  batch_size: 8
  eval_batch_size: 8
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false
  mosaic: false
  mixup: false
  perspective_p: 0.1
  fliplr: 0.5
  brightness_contrast_p: 0.5
  hsv_p: 0.1
  scale: [1.0, 1.0]
  degrees: 0.0
  translate: 0.0
  shear: 0.0

training:
  backend: hf
  epochs: 30
  optimizer: adamw
  lr: 0.00005
  weight_decay: 0.0
  warmup_steps: 300
  scheduler: linear
  max_grad_norm: 0.1
  bf16: false
  amp: false
  gpu_augment: false
  ema: false
  patience: 8

  val_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.01
  train_viz:
    enabled: false
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr

logging:
  report_to: none
  save_dir: ../runs/dfine_s_v2
  wandb_project: smart-camera

checkpoint:
  save_best: true
  metric: eval_map
  mode: max
  save_interval: 1

evaluation:
  score_threshold: 0.0

seed: 42
