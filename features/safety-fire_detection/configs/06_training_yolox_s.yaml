# Training config — Fire Detection (YOLOX-S, official Megvii impl)
# License: Apache 2.0 (Megvii)
#
# Recipe: official Megvii YOLOX with torchvision v2 aug. MixUp disabled across
# all feature configs (Mosaic alone for regularization). Affine scale tightened
# to [0.9, 1.1] — fire/smoke bboxes at 0.01–0.1% of image; aggressive scale
# jitter pushes objects below the training grid.
#
# Run (requires the official Megvii venv, NOT the main .venv/):
#   bash scripts/setup-yolox-venv.sh                        # one-time
#   CUDA_VISIBLE_DEVICES=0 .venv-yolox-official/bin/python core/p06_training/train.py \
#     --config features/safety-fire_detection/configs/06_training_yolox_s.yaml

model:
  arch: yolox-s
  impl: official              # Megvii upstream package via _OfficialYOLOXAdapter
  pretrained: ../../../pretrained/yolox_s.pth
  num_classes: 2
  input_size: [640, 640]
  depth: 0.33
  width: 0.50

data:
  dataset_config: 05_data.yaml
  batch_size: 16
  eval_batch_size: 4
  num_workers: 4               # Mosaic does 4 disk reads/sample
  prefetch_factor: 4
  pin_memory: true
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision         # REQUIRED for Mosaic — Albumentations doesn't implement it
  normalize: false             # Megvii YOLOX weights expect raw [0, 255] inputs (NOT /255)
  mosaic: true                 # biggest single lever for YOLOX
  mixup: false
  perspective_p: 0.1
  fliplr: 0.5
  flipud: 0.0                  # YOLOX never flips vertically
  brightness_contrast_p: 0.3   # light only — fire color is class-defining
  brightness: 0.1
  contrast: 0.1
  hsv_p: 0.1
  hsv_h: 0.015                 # tight HSV — color is class-defining
  hsv_s: 0.3
  hsv_v: 0.3
  min_bbox_area: 4.0           # 2×2 px minimum
  scale: [0.9, 1.1]            # tight — fire/smoke objects already tiny
  degrees: 10.0
  translate: 0.1
  shear: 2.0

training:
  backend: pytorch
  epochs: 60                     # Standardized with DETR configs
  optimizer: sgd
  lr: 0.001                    # Megvii rule: basic_lr × bs/64 ≈ 0.001 at bs=16
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 3
  scheduler: cosine
  min_lr: 0.00001                 # absolute floor (1e-5)
  patience: 20                    # Standardized with DETR configs
  val_full_interval: 0         # full val every epoch — quick-val overstates mAP
  val_subset_fraction: 1.0     # ignored when val_full_interval=0
  amp: true                    # YOLOX is AMP-safe (unlike DETR-family)
  grad_clip: 35.0
  ema: false
  ema_decay: 0.9998
  gpu_augment: false           # Mosaic stays on CPU (calls dataset.get_raw_item())

  val_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.25       # YOLOX: TPs sit at 0.5+, FPs flood below 0.25
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.25
    gt_color_rgb: [160, 32, 240]
    pred_color_rgb: [0, 200, 0]
    gt_thickness: 2
    pred_thickness: 1
    text_scale: 0.4
    dpi: 150
  train_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.25
    grid_cols: 2
    balanced: true
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
    thickness: 2
    text_scale: 0.4
    dpi: 120
  aug_viz:
    enabled: true              # verify Mosaic is running
    splits: [train]
    num_samples: 16
    grid_cols: 4
    thickness: 2
    text_scale: 0.4
    dpi: 120

loss:
  type: yolox

logging:
  wandb_project: smart-camera
  save_dir: ../runs/yolox_s

checkpoint:
  save_best: true
  metric: val/mAP50
  mode: max
  save_interval: 10

evaluation:
  score_threshold: 0.015          # Near-canonical mAP (filters noise). Inference uses 0.075 per-class (see 10_inference.yaml — validate via threshold_sweep.py across full range)

seed: 42
