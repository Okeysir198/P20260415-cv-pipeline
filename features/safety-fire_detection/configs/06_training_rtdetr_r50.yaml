# Training config — Fire Detection (RT-DETRv2-R50, HF Trainer backend)
#
# Recipe: paper-aligned (RT-DETRv2 arXiv 2407.17140 Table 1 + official
# optimizer.yml). Layered AdamW (head 1e-4, backbone 1e-5 = 1:10 split for R50),
# constant_with_warmup, EMA 0.9999 with 2000-step warmup.

model:
  arch: rtdetr-r50
  pretrained: PekingU/rtdetr_v2_r50vd
  num_classes: 2
  # 960 → 1024 (2026-05-05 v3) — R50 v2 EA showed small recall stuck at 0.33,
  # steepest miss-rate slope is size (+0.34 small vs large). Stride-8 cells go
  # 120 → 128, modest VRAM bump (~22 GB est at bs=4 vs prior 18.8 GB).
  input_size: [640, 640]
  # 30 → 50 (2026-05-05 v3) — R50 v2 EA showed missed = 53% of error volume,
  # 51% are TRUE misses (model emitted no candidate). With eos=0.1 firmly
  # penalising orphan-query background fires, the small extra capacity helps
  # capture diffuse smoke + crowded fire scenes. 50 = 5.5× p99 headroom.
  num_queries: 50                  # HF default: 300
  num_denoising: 100              # HF default: 100
  # Loss-recipe overhaul (2026-05-05) — mirrors R18 v2 changes that fixed
  # collapse: HF defaults caused calibration drift (peak at ep3 then collapse).
  # See R18 yaml + R18 run logs for evidence. Same recipe expected to behave
  # similarly on R50 (same arch family, just bigger backbone).
  box_noise_scale: 1.0            # HF default: 1.0 (no change)
  label_noise_ratio: 0.1          # HF default: 0.5 → reduced over-regularization
  eos_coefficient: 0.0001         # HF default
  focal_loss_alpha: 0.75          # HF default
  focal_loss_gamma: 2.0           # HF default

# normalize: false — fire dataset stats (mean ~0.39, std ~0.28) diverge from
# ImageNet (mean ~0.45, std ~0.23). Skipping normalize lets BatchNorm recenter
# per-batch and yields better convergence on this distribution.
tensor_prep:
  input_size: [640, 640]
  rescale: true
  normalize: false
  mean: [0.485, 0.456, 0.406]    # ignored when normalize=false
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  # R50 is ~2.1× backbone params vs R18. R18 used 12 GB at bs=8 / 960²; R50
  # estimate at bs=8/960² is ~22 GB (fits 32 GB GPU but tight if other tenants
  # are present). Keep bs=4 in YAML as the safe default; override at launch
  # time (--override data.batch_size=8) if GPU is free.
  batch_size: 8
  eval_batch_size: 8
  num_workers: 4                  # workers reduced (was 8) to bound CPU RAM during fork+COW
  prefetch_factor: 2              # was 6 — smaller in-flight buffer
  pin_memory: false               # was true — pinned memory adds RAM pressure
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false                # HF processor handles normalization
  mosaic: false                   # DETR-family doesn't use it
  mixup: false

  # Light aug recipe
  perspective_p: 0.0
  fliplr: 0.5
  flipud: 0.0
  brightness_contrast_p: 0.3
  brightness: 0.1
  contrast: 0.1
  hsv_p: 0.2
  hsv_h: 0.01                     # tight — fire color is class-defining
  hsv_s: 0.2
  hsv_v: 0.2

  min_bbox_area: 4.0              # keep small fire/smoke (2×2 px minimum)

  scale: [0.9, 1.1]
  degrees: 5.0
  translate: 0.05
  shear: 0.0

training:
  backend: hf
  epochs: 60                      # Extended from 30 for full convergence
  optimizer: adamw
  # 1e-4 → 5e-5 (mirrors R18 v2). Halved gradient magnitude prevents the
  # post-peak overshoot that caused R18 v1 collapse (peak ep3 → 0.19 by ep14).
  lr: 0.00005                     # HF default: 1e-4 → head + encoder + decoder
  lr_backbone: 0.00001             # 1:5 split (HF default: 1e-5, kept) → paper LR retained for backbone, head halved for stability
  weight_decay: 0.0001            # HF default: 1e-4 (no change)
  warmup_steps: 2000              # HF default: varies → paper LinearWarmup
  # Cosine decay 1e-4 → 1e-5 over the run. Paper uses MultiStepLR with milestone
  # past run end (effectively flat); for our 30-epoch fine-tune a cooldown phase
  # helps the model settle near the end instead of overshooting (early peak then
  # noisy plateau observed at flat LR).
  scheduler: cosine_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 0.00001               # absolute floor (1e-5)
  # 0.1 → 0.5 (2026-05-05 v3) — R50 v2 logs showed pre-clip grad_norm in 30-150
  # range, so 0.1 was nuking gradient direction (essentially zero-out clip).
  # 0.5 lets real signal through; offset by EMA below for stability.
  max_grad_norm: 0.5
  bf16: true
  amp: false                      # fp16 AMP overflows DETR decoder
  gpu_augment: false              # ignored on HF backend
  ema: false
  # decay 0.9999 → 0.999 (2026-05-05 v3) — at 0.9999 the EMA needs ~1/(1-decay)
  # = 10000 steps to "warm up" (~3 epochs of bs=4 here), so it never engaged
  # productively in R50 v2 (best was ep3, ES at ep18). 0.999 → ~1000-step
  # warmup → EMA averages from ep1 onward, smoothing the late-epoch oscillation
  # that prevented post-ep3 epochs from beating the early peak.
  ema_decay: 0.999
  ema_warmup_steps: 500           # was 2000 — start averaging early
  patience: 20                    # Extended patience for longer training

  val_viz:
    enabled: true
    num_samples: 40
    conf_threshold: 0.01          # DETR sigmoid scores cap ~0.2
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.01
  train_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr

logging:
  report_to: none
  save_dir: ../runs/rtdetr_r50
  wandb_project: smart-camera

checkpoint:
  save_best: true
  metric: eval_map_50
  mode: max
  save_interval: 1

evaluation:
  score_threshold: 0.015          # Near-canonical mAP (filters noise). Inference uses 0.075 per-class (see 10_inference.yaml — validate via threshold_sweep.py across full range)

seed: 42
