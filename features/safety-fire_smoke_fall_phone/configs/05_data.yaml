# Dataset config — Fire + Smoke + Fall + Phone usage (combined)
dataset_name: "fire_smoke_fall_phone"
path: "../../../dataset_store/training_ready/fire_smoke_fall_phone"
train: "train/images"
val: "val/images"
test: "test/images"

names:
  0: fire
  1: smoke
  2: fallen_person
  3: phone_usage
num_classes: 4
input_size: [640, 640]

# Normalization (ImageNet defaults; configs use normalize: false — fire stats diverge
# from ImageNet by ~10%, see safety-fire_detection/CLAUDE.md Load-bearing fact #2)
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

# SAM3-friendly text prompts (carried over from per-source feature configs)
text_prompts:
  fire: "flames, burning fire, visible fire"
  smoke: "smoke, gray or white smoke plume, haze from fire"
  fallen_person: "a person lying on the ground, fallen down, collapsed on the floor"
  phone_usage: "a person holding a mobile phone to their ear or in front of their face, texting or calling on a smartphone"

# Required by p02 annotation QA (empty is fine)
auto_label:
  class_rules: []
