# Training config — Helmet Detection (D-FINE-N, HF Trainer backend)
# License: Apache 2.0 (USTC / DEIM)
#
# Recipe: official Peterande/D-FINE per-arch dfine_hgnetv2_n_coco.yml — layered
# AdamW with 1:2 LR ratio, constant_with_warmup, clip 0.1, EMA 0.9999.
# This is the smallest D-FINE variant (~3.8 M params). Only COCO pretrain
# on HF — no obj2coco variant exists for nano.
#
# Helmet-specific: tail class `head_with_nitto_hat` at 1.6%. 4-class
# multi-class stress test. Watch per-class AP during training.

model:
  arch: dfine-n
  pretrained: ustc-community/dfine_n_coco
  num_classes: 4
  input_size: [640, 640]
  num_queries: 300
  num_denoising: 100
  box_noise_scale: 1.0
  label_noise_ratio: 0.5
  eos_coefficient: 0.0001
  focal_loss_alpha: 0.75
  focal_loss_gamma: 2.0

tensor_prep:
  input_size: [640, 640]
  rescale: true
  normalize: false
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  applied_by: hf_processor

data:
  dataset_config: 05_data.yaml
  batch_size: 4
  eval_batch_size: 2
  num_workers: 4
  prefetch_factor: 2
  pin_memory: false
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false
  mosaic: false                  # DETR-family bad with mosaic (bipartite matching disturbed)
  mixup: false

  perspective_p: 0.1
  fliplr: 0.5
  flipud: 0.0
  brightness_contrast_p: 0.5
  brightness: 0.2
  contrast: 0.2
  hsv_p: 0.3
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.4
  min_bbox_area: 4.0

  scale: [0.9, 1.1]              # tight — head bbox already small
  degrees: 5.0
  translate: 0.1
  shear: 2.0

training:
  backend: hf
  epochs: 120
  optimizer: adamw
  lr: 0.0002
  lr_backbone: 0.0001
  weight_decay: 0.000125
  warmup_steps: 500
  scheduler: constant_with_warmup
  max_grad_norm: 0.1
  bf16: false                    # MANDATORY for D-FINE
  amp: false
  gpu_augment: false
  ema: true
  ema_decay: 0.9999
  ema_warmup_steps: 1000
  patience: 30

  val_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.01
  train_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.01
    grid_cols: 2
    balanced: true
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4

loss:
  type: detr

logging:
  report_to: none
  save_dir: ../runs/dfine_n
  wandb_project: smart-camera

checkpoint:
  save_best: true
  metric: eval_map_50
  mode: max
  save_interval: 1               # mandatory for D-FINE

evaluation:
  score_threshold: 0.0

seed: 42
