# Training config — Helmet Detection (YOLOX-M, official Megvii impl)
# License: Apache 2.0 (Megvii)
#
# Recipe: official Megvii YOLOX with torchvision v2 aug. MixUp disabled
# (user preference). Mosaic ON (single biggest YOLOX regularization lever).
# Scale tightened to [0.9, 1.1] — head bboxes are medium-small; extreme
# scale jitter can crop heads out of frame.
#
# Helmet-specific: tail class `head_with_nitto_hat` at 1.6%. Mosaic is the
# main regularizer that protects rare-class AP (reference: Goggles +0.13 AP
# on CPPE-5 from Mosaic alone on an analogous tail class).
#
# Run (requires the official Megvii venv, NOT the main .venv/):
#   bash scripts/setup-yolox-venv.sh                        # one-time
#   CUDA_VISIBLE_DEVICES=0 .venv-yolox-official/bin/python core/p06_training/train.py \
#     --config features/ppe-helmet_detection/configs/06_training_yolox_m.yaml

model:
  arch: yolox-m
  impl: official
  pretrained: ../../../pretrained/yolox_m.pth
  num_classes: 4
  input_size: [640, 640]
  depth: 0.67
  width: 0.75

data:
  dataset_config: 05_data.yaml
  batch_size: 16
  eval_batch_size: 4
  num_workers: 4
  prefetch_factor: 4
  pin_memory: true
  subset:
    train: null
    val: null
    test: null

augmentation:
  library: torchvision
  normalize: false               # Megvii YOLOX weights expect raw [0, 255]
  mosaic: true
  mixup: false
  perspective_p: 0.1
  fliplr: 0.5
  flipud: 0.0
  brightness_contrast_p: 0.5
  brightness: 0.2
  contrast: 0.2
  hsv_p: 0.3
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.4
  min_bbox_area: 4.0
  scale: [0.9, 1.1]
  degrees: 5.0
  translate: 0.1
  shear: 2.0

training:
  backend: pytorch
  epochs: 80
  optimizer: sgd
  lr: 0.001                      # Megvii rule: basic_lr x bs/64 = 0.001 at bs=16
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 3
  scheduler: cosine
  patience: 30
  val_full_interval: 0
  val_subset_fraction: 1.0
  amp: true
  grad_clip: 35.0
  ema: false
  ema_decay: 0.9998
  gpu_augment: false

  val_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.25
    grid_cols: 2
    balanced: true
  best_viz:
    enabled: true
    num_samples: 16
    conf_threshold: 0.25
    gt_color_rgb: [160, 32, 240]
    pred_color_rgb: [0, 200, 0]
    gt_thickness: 2
    pred_thickness: 1
    text_scale: 0.4
    dpi: 150
  train_viz:
    enabled: true
    num_samples: 10
    conf_threshold: 0.25
    grid_cols: 2
    balanced: true
  data_viz:
    enabled: true
    splits: [train, val, test]
    num_samples: 16
    grid_cols: 4
    thickness: 2
    text_scale: 0.4
    dpi: 120
  aug_viz:
    enabled: true
    splits: [train]
    num_samples: 16
    grid_cols: 4
    thickness: 2
    text_scale: 0.4
    dpi: 120

loss:
  type: yolox

logging:
  wandb_project: smart-camera
  save_dir: ../runs/yolox_m

checkpoint:
  save_best: true
  metric: val/mAP50
  mode: max
  save_interval: 10

evaluation:
  score_threshold: 0.0

seed: 42
